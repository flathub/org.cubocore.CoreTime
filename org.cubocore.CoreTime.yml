app-id: org.cubocore.CoreTime
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: coretime
rename-desktop-file: cc.cubocore.CoreTime.desktop
rename-icon: cc.cubocore.CoreTime
rename-appdata-file: cc.cubocore.CoreTime.metainfo.xml
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio # Required for ringing alarm
  - --device=dri
  - --filesystem=home # Storing weather data
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/pkgconfig
  - /man
  - /share/man
  - /lib/*.la
  - /lib/*.a
modules:
  - name: libcprime
    buildsystem: cmake-ninja
    config-opts: [
        "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    ]
    sources:
      - type: git
        url: https://gitlab.com/cubocore/libcprime.git
        commit: 17d4c94f3be2c7f67dc757cf852f0144945c2c69
        tag: v5.0.1
  - name: coretime
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://gitlab.com/cubocore/coreapps/coretime.git
        commit: f039f0eea9bce9fe103889e478f5a68a87f9621c
        tag: v5.0.1
      - type: patch
        path: fix-appID-name.patch
